<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Maestro quality feedback loop in CI</title>
  <desc id="desc">A pipeline showing pull request smoke flows, device matrix regression, API evidence and release confidence.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2732"/><stop offset="1" stop-color="#0b1116"/></linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8cc9ff"/></marker>
  </defs>
  <rect width="1200" height="390" rx="10" fill="url(#bg2)"/>
  <text x="54" y="55" fill="#8cc9ff" font-family="monospace" font-size="16" letter-spacing="3">FROM COMMIT TO CONFIDENCE</text>
  <text x="54" y="88" fill="#f0f5f1" font-family="Arial, sans-serif" font-size="25" font-weight="600">Use the cheapest useful signal first.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 145)">
      <rect width="210" height="130" rx="8" fill="#111a21" stroke="#49616b"/><text x="24" y="40" fill="#8cc9ff" font-size="15" font-family="monospace">01</text><text x="24" y="75" fill="#f0f5f1" font-size="21" font-weight="600">Pull request</text><text x="24" y="103" fill="#9da9a8" font-size="15">Smoke flows + API</text><text x="24" y="123" fill="#9da9a8" font-size="15">contract checks</text>
    </g>
    <path d="M292 210H340" stroke="#8cc9ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <g transform="translate(360 145)">
      <rect width="210" height="130" rx="8" fill="#111a21" stroke="#49616b"/><text x="24" y="40" fill="#8cc9ff" font-size="15" font-family="monospace">02</text><text x="24" y="75" fill="#f0f5f1" font-size="21" font-weight="600">CI runner</text><text x="24" y="103" fill="#9da9a8" font-size="15">Build app + install</text><text x="24" y="123" fill="#9da9a8" font-size="15">test dependencies</text>
    </g>
    <path d="M582 210H630" stroke="#8cc9ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <g transform="translate(650 145)">
      <rect width="210" height="130" rx="8" fill="#111a21" stroke="#49616b"/><text x="24" y="40" fill="#8cc9ff" font-size="15" font-family="monospace">03</text><text x="24" y="75" fill="#f0f5f1" font-size="21" font-weight="600">Device matrix</text><text x="24" y="103" fill="#9da9a8" font-size="15">Targeted mobile</text><text x="24" y="123" fill="#9da9a8" font-size="15">regression coverage</text>
    </g>
    <path d="M872 210H920" stroke="#8cc9ff" stroke-width="2" marker-end="url(#arrow2)"/>
    <g transform="translate(940 145)">
      <rect width="190" height="130" rx="8" fill="#11251f" stroke="#9de8c2"/><text x="24" y="40" fill="#9de8c2" font-size="15" font-family="monospace">04</text><text x="24" y="75" fill="#f0f5f1" font-size="21" font-weight="600">Signal</text><text x="24" y="103" fill="#9da9a8" font-size="15">Release decision</text><text x="24" y="123" fill="#9da9a8" font-size="15">with evidence</text>
    </g>
  </g>
  <text x="600" y="335" fill="#f4bd74" font-family="monospace" font-size="14" letter-spacing="2" text-anchor="middle">FAST FEEDBACK · ACTIONABLE FAILURES · TRUSTED RELEASES</text>
</svg>
