<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Vibe coding delivery loop</title>
  <desc id="desc">A four-step loop connecting context, plan, implementation and verification with human sign-off.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a24"/><stop offset="1" stop-color="#211744"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7ff2d0"/><stop offset=".5" stop-color="#c4a7ff"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="620" rx="30" fill="url(#bg)"/>
  <text x="90" y="92" fill="#9de8c2" font-family="monospace" font-size="22" letter-spacing="4">THE AGENTIC BUILD LOOP</text>
  <path d="M310 300 H1290" stroke="url(#line)" stroke-width="5" stroke-dasharray="12 14" opacity=".85"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(100 180)"><rect width="260" height="220" rx="22" fill="#172d31" stroke="#7ff2d0" stroke-width="2"/><text x="35" y="68" fill="#7ff2d0" font-family="monospace" font-size="18">01</text><text x="35" y="120" fill="#fff" font-size="30" font-weight="700">Context</text><text x="35" y="160" fill="#b8c8c6" font-size="18">Read the repo,</text><text x="35" y="188" fill="#b8c8c6" font-size="18">rules and risk.</text></g>
    <g transform="translate(460 180)"><rect width="260" height="220" rx="22" fill="#241e48" stroke="#c4a7ff" stroke-width="2"/><text x="35" y="68" fill="#c4a7ff" font-family="monospace" font-size="18">02</text><text x="35" y="120" fill="#fff" font-size="30" font-weight="700">Plan</text><text x="35" y="160" fill="#b8c8c6" font-size="18">Make behavior</text><text x="35" y="188" fill="#b8c8c6" font-size="18">explicit first.</text></g>
    <g transform="translate(820 180)"><rect width="260" height="220" rx="22" fill="#40233d" stroke="#ff6b9d" stroke-width="2"/><text x="35" y="68" fill="#ff9fbd" font-family="monospace" font-size="18">03</text><text x="35" y="120" fill="#fff" font-size="30" font-weight="700">Build</text><text x="35" y="160" fill="#b8c8c6" font-size="18">Change the</text><text x="35" y="188" fill="#b8c8c6" font-size="18">smallest surface.</text></g>
    <g transform="translate(1180 180)"><rect width="260" height="220" rx="22" fill="#3b2d1c" stroke="#f4bd74" stroke-width="2"/><text x="35" y="68" fill="#f4bd74" font-family="monospace" font-size="18">04</text><text x="35" y="120" fill="#fff" font-size="30" font-weight="700">Verify</text><text x="35" y="160" fill="#b8c8c6" font-size="18">Run evidence.</text><text x="35" y="188" fill="#b8c8c6" font-size="18">Review the diff.</text></g>
  </g>
  <text x="800" y="515" text-anchor="middle" fill="#f5f8f7" font-family="monospace" font-size="20" letter-spacing="2">HUMAN SIGN-OFF STAYS IN THE LOOP</text>
</svg>
