<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The agentic build loop</title>
  <desc id="desc">Four connected stages — Context, Plan, Build and Verify — with arrows showing the work returning from Verify back to Context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a24"/><stop offset="1" stop-color="#211744"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 6 L0 12 Z" fill="#7ff2d0"/></marker>
  </defs>
  <rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
  <text x="100" y="92" fill="#9de8c2" font-family="monospace" font-size="24" letter-spacing="4">THE AGENTIC BUILD LOOP</text>
  <text x="100" y="137" fill="#dce8e5" font-family="Arial, sans-serif" font-size="24">Make context explicit. Make every change verifiable.</text>

  <!-- One consistent process accent. The arrows form a clockwise loop. -->
  <g fill="none" stroke="#7ff2d0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M720 335 H858"/>
    <path d="M1190 480 V560"/>
    <path d="M858 725 H720"/>
    <path d="M410 560 V480"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(100 205)">
      <rect width="620" height="275" rx="24" fill="#17262b" stroke="#7ff2d0" stroke-width="3"/>
      <text x="42" y="64" fill="#7ff2d0" font-family="monospace" font-size="22" letter-spacing="2">01</text>
      <text x="42" y="126" fill="#ffffff" font-size="46" font-weight="700">Context</text>
      <text x="42" y="184" fill="#dce8e5" font-size="28">Read the repo, rules</text>
      <text x="42" y="224" fill="#dce8e5" font-size="28">and risk before acting.</text>
    </g>
    <g transform="translate(880 205)">
      <rect width="620" height="275" rx="24" fill="#17262b" stroke="#7ff2d0" stroke-width="3"/>
      <text x="42" y="64" fill="#7ff2d0" font-family="monospace" font-size="22" letter-spacing="2">02</text>
      <text x="42" y="126" fill="#ffffff" font-size="46" font-weight="700">Plan</text>
      <text x="42" y="184" fill="#dce8e5" font-size="28">Make behavior explicit</text>
      <text x="42" y="224" fill="#dce8e5" font-size="28">before writing code.</text>
    </g>
    <g transform="translate(880 560)">
      <rect width="620" height="275" rx="24" fill="#17262b" stroke="#7ff2d0" stroke-width="3"/>
      <text x="42" y="64" fill="#7ff2d0" font-family="monospace" font-size="22" letter-spacing="2">03</text>
      <text x="42" y="126" fill="#ffffff" font-size="46" font-weight="700">Build</text>
      <text x="42" y="184" fill="#dce8e5" font-size="28">Change the smallest</text>
      <text x="42" y="224" fill="#dce8e5" font-size="28">surface that solves it.</text>
    </g>
    <g transform="translate(100 560)">
      <rect width="620" height="275" rx="24" fill="#17262b" stroke="#7ff2d0" stroke-width="3"/>
      <text x="42" y="64" fill="#7ff2d0" font-family="monospace" font-size="22" letter-spacing="2">04</text>
      <text x="42" y="126" fill="#ffffff" font-size="46" font-weight="700">Verify</text>
      <text x="42" y="184" fill="#dce8e5" font-size="28">Run evidence. Review</text>
      <text x="42" y="224" fill="#dce8e5" font-size="28">the diff. Then iterate.</text>
    </g>
  </g>

  <text x="410" y="900" text-anchor="middle" fill="#7ff2d0" font-family="monospace" font-size="22" letter-spacing="2">↻ BACK TO CONTEXT</text>
  <text x="800" y="955" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="22" letter-spacing="2">HUMAN SIGN-OFF STAYS IN THE LOOP</text>
</svg>
