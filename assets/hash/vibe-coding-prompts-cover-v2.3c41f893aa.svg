      <circle cx="160" cy="160" r="104" fill="none" stroke="url(#glow)" stroke-width="18" stroke-dasharray="80 24"/>
      <circle cx="160" cy="160" r="53" fill="#c4a7ff" fill-opacity=".2" stroke="#c4a7ff" stroke-width="2"/>
      <text x="160" y="151" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="48" font-weight="700">15</text>
      <text x="160" y="184" text-anchor="middle" fill="#b8c8c6" font-family="monospace" font-size="15" letter-spacing="2">STAGES</text>
      <circle cx="160" cy="15" r="10" fill="#ff6b9d"/><circle cx="305" cy="160" r="10" fill="#7ff2d0"/><circle cx="160" cy="305" r="10" fill="#c4a7ff"/><circle cx="15" cy="160" r="10" fill="#f4bd74"/>
