<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Coding Prompts</title>
  <desc id="desc">A colourful editorial cover for a fifteen-stage AI-assisted product engineering playbook.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1116"/><stop offset=".48" stop-color="#24164c"/><stop offset="1" stop-color="#09545d"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6b9d"/><stop offset=".5" stop-color="#c4a7ff"/><stop offset="1" stop-color="#7ff2d0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1270" cy="130" r="220" fill="#ff6b9d" opacity=".34" filter="url(#blur)"/>
  <circle cx="320" cy="780" r="260" fill="#54e5d0" opacity=".28" filter="url(#blur)"/>
  <path d="M0 730 C280 580 360 900 690 710 S1240 420 1600 610" fill="none" stroke="url(#glow)" stroke-width="3" opacity=".8"/>
  <g>
    <rect x="112" y="108" width="1376" height="684" rx="32" fill="#0c151d" fill-opacity=".76" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="154" y="150" width="54" height="12" rx="6" fill="#ff6b9d"/>
    <rect x="220" y="150" width="54" height="12" rx="6" fill="#c4a7ff"/>
    <rect x="286" y="150" width="54" height="12" rx="6" fill="#7ff2d0"/>
    <text x="154" y="290" fill="#9de8c2" font-family="monospace" font-size="25" letter-spacing="5">AI-AUGMENTED QUALITY ENGINEERING</text>
    <text x="154" y="410" fill="#f5f8f7" font-family="Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">Vibe Coding</text>
    <text x="154" y="510" fill="#f5f8f7" font-family="Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">Prompts</text>
    <rect x="154" y="570" width="820" height="3" fill="url(#glow)"/>
    <text x="154" y="635" fill="#b8c8c6" font-family="Arial, sans-serif" font-size="31">The exact prompt for every stage of the build.</text>
    <text x="154" y="705" fill="#7ff2d0" font-family="monospace" font-size="22" letter-spacing="3">PRD  ·  PLAN  ·  SPEC  ·  BUILD  ·  VERIFY</text>
